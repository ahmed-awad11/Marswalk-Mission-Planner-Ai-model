[project]
name = "marswalk-intelligence"
version = "0.1.0"
description = "Marswalk Mission Planner — Scientific AI & RAG Prediction Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "scikit-image>=0.22.0",
    "chromadb>=0.4.24",
    "google-genai>=0.1.0",
    "openai>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
